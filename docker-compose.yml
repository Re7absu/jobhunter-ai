services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+pg8000://jobhunter:jobhunter@db:5432/jobhunter
      STORAGE_DIR: /data/storage
    volumes: [cvdata:/data/storage]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000/api }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  cvdata:
